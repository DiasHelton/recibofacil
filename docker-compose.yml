name: recibofacil

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recibofacil
      POSTGRES_USER: recibofacil
      POSTGRES_PASSWORD: recibofacil
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recibofacil"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    command: >
      sh -c "
        python manage.py makemigrations core --noinput &&
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://recibofacil:recibofacil@db:5432/recibofacil
      DJANGO_SECRET_KEY: local-development-only
      DEBUG: "1"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
