services:
  - type: web
    name: recibofacil
    runtime: docker
    repo: https://github.com/SEU_USUARIO/recibofacil
    plan: free
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DJANGO_SECRET_KEY
        value: chamanabota
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DEBUG
        value: "0"
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /
