app = "recibofacil"

primary_region = "gig"

[build]
  dockerfile = "Dockerfile"

[env]
  DEBUG = "0"
  ALLOWED_HOSTS = ".fly.dev,.fly.io"
  DJANGO_SECRET_KEY = "gerar-uma-chave-segura-com-flyctl-secrets-set"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "get"
    path = "/"
    timeout = "5s"
